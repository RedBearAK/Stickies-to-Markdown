[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stickies-to-markdown"
description = "One-way mirror of Apple Stickies notes into annotated Markdown files (Obsidian-friendly, but consumer-agnostic)."
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [{name = "RedBearAK"}]
keywords = ["stickies", "markdown", "obsidian", "notes", "macos", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
# 3.9 floor to match Duplicate-File-Preventer (watchdog 6 needs 3.9).
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/RedBearAK/stickies-to-markdown"

[project.scripts]
stickies2md = "stickies_to_markdown.__main__:main"

[project.optional-dependencies]
# macOS menu bar front end. rumps pulls in PyObjC; the marker keeps it off
# Linux/Windows entirely:  pip install '.[menubar]'
menubar = ["rumps>=0.4 ; sys_platform == 'darwin'"]
# Better conversion: markdownify for the HTML stage, pypandoc-binary for a
# pandoc tier that works on any OS. Both are auto-detected; without them the
# stdlib walker and text tiers are used.  pip install '.[convert]'
convert = ["markdownify>=1.1.0", "pypandoc-binary>=1.13"]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stickies_to_markdown*"]

[tool.setuptools.package-data]
stickies_to_markdown = ["frontends/icons/*.png", "frontends/icons/*.icns",
                        "frontends/launcher_template.c"]

[tool.setuptools.dynamic]
version = {attr = "stickies_to_markdown._version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"
filterwarnings = [
    "ignore:Test functions should return None",
    "ignore::pytest.PytestReturnNotNoneWarning",
]
